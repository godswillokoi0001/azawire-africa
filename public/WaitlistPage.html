    <script>
      function savePartialData() {
        var phonenum = document.getElementById("waphone").value;
        if (phonenum.length < 7) {
          $("#phone_error").show(1000);
          $("#phone_errorx").show(1000);
          $("#sniperbutton").prop("disabled", true);
          return;
        } else {
          $("#phone_error").hide(1000);
          $("#phone_errorx").hide(1000);
          $("#sniperbutton").prop("disabled", false);
        }
      }
    </script>

    <script>
      document
        .getElementById("wamationform")
        .addEventListener("submit", function (e) {
          var isValid = true;
          var checkboxGroups = document.querySelectorAll(".checkbox-group");

          checkboxGroups.forEach(function (group) {
            var required = group.getAttribute("data-required") === "required";
            if (required) {
              var checkboxes = group.querySelectorAll('input[type="checkbox"]');
              var isChecked = Array.from(checkboxes).some(
                (checkbox) => checkbox.checked
              );

              if (!isChecked) {
                isValid = false;
                alert(
                  "Please select at least one option for " +
                    group.previousElementSibling.innerText.replace("*", "")
                );
              }
            }
          });

          if (!isValid) {
            e.preventDefault();
            $("#sniperbutton").prop("disabled", false); // Immediately re-enable button
            setTimeout(function () {
              $("#sniperbutton").prop("disabled", false);
            }, 5000); // Re-enable button after 5 seconds
          } else {
            $("#sniperbutton").html("Submitting...");
            $("#sniperbutton").prop("disabled", true);
            $("#sniperbutton").css({ backgroundColor: "#D0D0D0" });
          }
        });
    </script>

    <script>
        $(document).ready(function() {
            $('.select2').select2({
                dropdownParent: $('body'),
                theme: 'classic',
                templateResult: formatCountry,
                templateSelection: formatCountry
            });
        });

        function formatCountry(country) {
            if (!country.id) return country.text;
            return $('<span>' + country.text + '</span>');
        }
    </script>

        { code: "48", name: "Poland", dial: "+48" },

        { code: "380", name: "Ukraine", dial: "+380" },
        { code: "971", name: "United Arab Emirates", dial: "+971" },
        { code: "966", name: "Saudi Arabia", dial: "+966" },
        { code: "974", name: "Qatar", dial: "+974" },

        { code: "961", name: "Lebanon", dial: "+961" },
        { code: "962", name: "Jordan", dial: "+962" },
        { code: "972", name: "Israel", dial: "+972" },
        { code: "90", name: "Turkey", dial: "+90" },
        { code: "60", name: "Malaysia", dial: "+60" },
        { code: "62", name: "Indonesia", dial: "+62" },
        { code: "63", name: "Philippines", dial: "+63" },
        { code: "84", name: "Vietnam", dial: "+84" },
        { code: "66", name: "Thailand", dial: "+66" },
        { code: "65", name: "Singapore", dial: "+65" },
        { code: "880", name: "Bangladesh", dial: "+880" },
        { code: "92", name: "Pakistan", dial: "+92" },
        { code: "94", name: "Sri Lanka", dial: "+94" },
        { code: "977", name: "Nepal", dial: "+977" }
    ];

    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('countrySearch');
        const countryList = document.getElementById('countryList');
        const wnopfx = document.getElementById('wnopfx');

        // Set default country
        const defaultCountry = countries.find(c => c.code === "234");
        searchInput.value = `${defaultCountry.dial} (${defaultCountry.name})`;

        function filterCountries(searchTerm) {
            return countries.filter(country => 
                country.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                country.dial.includes(searchTerm)
            );
        }

        function displayCountries(filteredCountries) {
            countryList.innerHTML = filteredCountries.map(country => `
                <div class="p-2 hover:bg-gray-800 cursor-pointer text-white" 
                     data-code="${country.code}" 
                     data-dial="${country.dial}">
                    ${country.dial} (${country.name})
                </div>
            `).join('');
        }

        searchInput.addEventListener('focus', () => {
            displayCountries(countries);
            countryList.classList.remove('hidden');
        });

        searchInput.addEventListener('input', (e) => {
            const filtered = filterCountries(e.target.value);
            displayCountries(filtered);
            countryList.classList.remove('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !countryList.contains(e.target)) {
                countryList.classList.add('hidden');
            }
        });

        countryList.addEventListener('click', (e) => {
            const countryDiv = e.target.closest('div');
            if (countryDiv) {
                const code = countryDiv.dataset.code;
                const dial = countryDiv.dataset.dial;
                const country = countries.find(c => c.code === code);
                searchInput.value = `${dial} (${country.name})`;
                wnopfx.value = code;
                countryList.classList.add('hidden');
            }
        });
    });
    </script>
